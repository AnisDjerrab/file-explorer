[package]
name = "service"
version = "0.0.1"
edition = "2021"

[[bin]]
name = "service"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tree_magic_mini = "3.2.2"
tauri-plugin-shell = "2"
etcetera = "0.11"
tauri-plugin-android-fs = "28.1.0"
