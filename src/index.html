<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="styles.css" />
    <title>File Explorer</title>
    <script type="module" src="./main.js" defer></script>
  </head>

  <body>
      <aside class="sidebar"></aside>
      <main class="main">
        <header class="top_bar">
          <div>
            <button class="back">
              <img src="assets/actions/go-previous-symbolic.svg" class="svg">
            </button>
            <button class="next">
              <img src="assets/actions/go-next-symbolic.svg" class="svg">
            </button>
          </div>
          <input type="search" name="q" class="path_area" placeholder="">
          <form role="search" class="search_area">
            <button type="submit"><img src="assets/actions/edit-find-symbolic.svg" class="svg"></button>
          </form>
        </header>
        <div class="file_icons_grid">
        </div>
      </main>
  </body>
</html>
