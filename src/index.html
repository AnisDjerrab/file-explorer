<!doctype html>
<html lang="en">
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="styles.css" />
    <title>File Explorer</title>
    <script type="module" src="main.js" defer></script>
  </head>

  <body>
      <aside class="sidebar"></aside>
      <main class="main">
        <header class="top_bar">
          <div>
            <button class="back">
              <img src="assets/actions/go-previous-symbolic.svg" class="svg">
            </button>
            <button class="next">
              <img src="assets/actions/go-next-symbolic.svg" class="svg">
            </button>
          </div>
          <input type="search" name="q" class="path_area" placeholder="">
          <div>
            <button type="submit"><img src="assets/actions/edit-find-symbolic.svg" class="svg"></button>
            <button type="submit">
              <img src="assets/actions/view-list-symbolic.svg" class="svg">
              |
              <img src="assets/actions/go-down-symbolic.svg" class="svg">
            </button>
          </div>
        </header>
        <div class="file_icons_grid">
          <div id="selection-box"></div>
        </div>
      </main>
  </body>
</html>
